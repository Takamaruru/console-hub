<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Console Hub</title>
<style>
  :root {
    --bg: #1e1e2e;
    --surface: #313244;
    --surface-hover: #45475a;
    --text: #cdd6f4;
    --accent: #cba6f7;
    --accent-2: #f5c2e7;
    --danger: #f38ba8;
    --success: #a6e3a1;
    --muted: #6c7086;
    --border: #45475a;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    margin: 0;
    min-height: 100vh;
    padding: 32px 16px 80px;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
    flex-wrap: wrap;
    gap: 12px;
  }

  h1 {
    color: var(--accent);
    font-size: 1.6rem;
    margin: 0;
    font-weight: 600;
  }

  .subtitle {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 2px;
  }

  .add-btn {
    background: var(--accent);
    color: var(--bg);
    border: none;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform .15s, opacity .15s;
  }
  .add-btn:hover { transform: translateY(-2px); opacity: .9; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 14px;
  }

  .card {
    background: var(--surface);
    border-radius: 14px;
    padding: 20px;
    text-decoration: none;
    color: var(--text);
    position: relative;
    transition: transform .15s, background .15s;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-height: 96px;
    border: 1px solid transparent;
  }
  .card:hover {
    background: var(--surface-hover);
    transform: translateY(-3px);
    border-color: var(--accent);
  }

  .card-name {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--accent-2);
    word-break: break-all;
  }

  .card-url {
    font-size: 0.78rem;
    color: var(--muted);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    word-break: break-all;
  }

  .card-actions {
    position: absolute;
    top: 8px;
    right: 8px;
    display: flex;
    gap: 4px;
    opacity: 0;
    transition: opacity .15s;
  }
  .card:hover .card-actions { opacity: 1; }

  .icon-btn {
    background: rgba(0,0,0,.3);
    border: none;
    color: var(--text);
    width: 26px;
    height: 26px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
    display: grid;
    place-items: center;
  }
  .icon-btn:hover { background: var(--bg); }
  .icon-btn.del:hover { background: var(--danger); color: var(--bg); }

  .machine {
    margin-bottom: 28px;
  }
  .machine-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .machine-name {
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--text);
  }
  .machine-host {
    font-size: 0.8rem;
    color: var(--muted);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .machine-actions {
    margin-left: auto;
    display: flex;
    gap: 4px;
  }
  .machine-actions .icon-btn { background: var(--surface); }
  .machine-actions .icon-btn:hover { background: var(--surface-hover); }
  .machine-actions .icon-btn.del:hover { background: var(--danger); color: var(--bg); }

  .card-port {
    font-size: 0.85rem;
    color: var(--accent);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }

  .header-actions { display: flex; gap: 8px; }
  .add-btn.sub {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
  }

  .field select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 0.95rem;
    font-family: inherit;
  }
  .field select:focus { outline: none; border-color: var(--accent); }
  .field-hint {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 4px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 60px 20px;
    border: 2px dashed var(--border);
    border-radius: 14px;
  }

  /* Modal */
  .modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.6);
    backdrop-filter: blur(4px);
    display: none;
    place-items: center;
    z-index: 100;
    padding: 20px;
  }
  .modal-bg.show { display: grid; }

  .modal {
    background: var(--surface);
    border-radius: 16px;
    padding: 24px;
    width: 100%;
    max-width: 420px;
    border: 1px solid var(--border);
  }

  .modal h2 {
    margin: 0 0 16px;
    color: var(--accent);
    font-size: 1.2rem;
  }

  .field {
    margin-bottom: 14px;
  }
  .field label {
    display: block;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 0.95rem;
    font-family: inherit;
  }
  .field input:focus {
    outline: none;
    border-color: var(--accent);
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 18px;
  }
  .btn {
    padding: 9px 18px;
    border-radius: 8px;
    border: none;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-primary { background: var(--accent); color: var(--bg); }
  .btn-secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
  .btn-primary:hover, .btn-secondary:hover { opacity: .85; }

  .footer {
    margin-top: 32px;
    text-align: center;
    color: var(--muted);
    font-size: 0.78rem;
  }
  .footer a { color: var(--muted); }

  @media (max-width: 480px) {
    h1 { font-size: 1.3rem; }
    .grid { grid-template-columns: 1fr 1fr; gap: 10px; }
    .card { padding: 16px; min-height: 80px; }
    .card-name { font-size: 1rem; }
    .card-actions { opacity: 1; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <h1>🖥️ Console Hub</h1>
      <div class="subtitle">プロジェクト別ターミナル</div>
    </div>
    <div class="header-actions">
      <button class="add-btn sub" onclick="openMachineModal()">+ マシン</button>
      <button class="add-btn" onclick="openModal()">+ 追加</button>
    </div>
  </header>

  <div id="list"></div>

  <div class="footer">
    データはこのブラウザのlocalStorageに保存されています
  </div>
</div>

<!-- Project Modal -->
<div class="modal-bg" id="modalBg" onclick="closeModalIfBg(event)">
  <div class="modal">
    <h2 id="modalTitle">新しいプロジェクトを追加</h2>
    <div class="field">
      <label for="nameInput">名前</label>
      <input type="text" id="nameInput" placeholder="Temportal" autocomplete="off">
    </div>
    <div class="field">
      <label for="machineSelect">マシン</label>
      <select id="machineSelect" onchange="updateUrlHint()"></select>
    </div>
    <div class="field">
      <label for="portInput">ポート番号</label>
      <input type="number" id="portInput" placeholder="3001" min="1" max="65535" autocomplete="off" oninput="updateUrlHint()">
      <div class="field-hint" id="urlHint"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="saveItem()">保存</button>
    </div>
  </div>
</div>

<!-- Machine Modal -->
<div class="modal-bg" id="machineModalBg" onclick="closeModalIfBg(event)">
  <div class="modal">
    <h2 id="machineModalTitle">新しいマシンを追加</h2>
    <div class="field">
      <label for="machineNameInput">名前</label>
      <input type="text" id="machineNameInput" placeholder="自宅サーバー" autocomplete="off">
    </div>
    <div class="field">
      <label for="hostInput">IPアドレス / ホスト</label>
      <input type="text" id="hostInput" placeholder="100.96.72.56" autocomplete="off">
      <div class="field-hint">https の場合は https://ホスト と入力</div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="saveMachine()">保存</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'consoleHubData_v2';
  const OLD_STORAGE_KEY = 'consoleHubItems_v1';
  let editingId = null;
  let editingMachineId = null;

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  // v1 (name + 完全なURL) → v2 (マシン + ポート) へ移行
  function migrateV1() {
    let old;
    try { old = JSON.parse(localStorage.getItem(OLD_STORAGE_KEY) || '[]'); } catch (e) { old = []; }
    const data = { machines: [], items: [] };
    for (const o of old) {
      let u;
      try { u = new URL(o.url); } catch (e) { continue; }
      const host = (u.protocol === 'https:' ? 'https://' : '') + u.hostname;
      let m = data.machines.find(m => m.host === host);
      if (!m) {
        m = { id: uid(), name: u.hostname, host };
        data.machines.push(m);
      }
      const port = Number(u.port) || (u.protocol === 'https:' ? 443 : 80);
      const path = u.pathname === '/' ? '' : u.pathname + u.search + u.hash;
      data.items.push({ id: uid(), machineId: m.id, name: o.name, port, path });
    }
    return data;
  }

  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    const data = migrateV1();
    saveData(data);
    return data;
  }

  function saveData(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  function hostUrl(host) {
    return /^https?:\/\//i.test(host) ? host.replace(/\/+$/, '') : 'http://' + host;
  }

  function itemUrl(machine, item) {
    return `${hostUrl(machine.host)}:${item.port}${item.path || '/'}`;
  }

  function render() {
    const data = loadData();
    const list = document.getElementById('list');

    if (data.machines.length === 0) {
      list.innerHTML = '<div class="empty">まだ何もないみたいだ。<br>右上の「+ マシン」からIPアドレスを登録しよう。</div>';
      return;
    }

    list.innerHTML = data.machines.map(m => {
      const items = data.items
        .filter(it => it.machineId === m.id)
        .sort((a, b) => a.port - b.port);
      const cards = items.length === 0
        ? '<div class="empty" style="padding:24px">プロジェクトなし</div>'
        : `<div class="grid">${items.map(it => `
          <a class="card" href="${escapeHtml(itemUrl(m, it))}" target="_blank" rel="noopener">
            <div class="card-name">${escapeHtml(it.name)}</div>
            <div class="card-port">:${it.port}${escapeHtml(it.path || '')}</div>
            <div class="card-actions">
              <button class="icon-btn" onclick="event.preventDefault();event.stopPropagation();editItem('${it.id}')" title="編集">✏️</button>
              <button class="icon-btn del" onclick="event.preventDefault();event.stopPropagation();deleteItem('${it.id}')" title="削除">🗑</button>
            </div>
          </a>`).join('')}</div>`;
      return `
        <section class="machine">
          <div class="machine-head">
            <span class="machine-name">${escapeHtml(m.name)}</span>
            <span class="machine-host">${escapeHtml(m.host)}</span>
            <div class="machine-actions">
              <button class="icon-btn" onclick="openModal('${m.id}')" title="このマシンにプロジェクトを追加">＋</button>
              <button class="icon-btn" onclick="editMachine('${m.id}')" title="マシンを編集">✏️</button>
              <button class="icon-btn del" onclick="deleteMachine('${m.id}')" title="マシンを削除">🗑</button>
            </div>
          </div>
          ${cards}
        </section>`;
    }).join('');
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function fillMachineSelect(selectedId) {
    const data = loadData();
    const sel = document.getElementById('machineSelect');
    sel.innerHTML = data.machines.map(m =>
      `<option value="${m.id}">${escapeHtml(m.name)} (${escapeHtml(m.host)})</option>`
    ).join('');
    if (selectedId) sel.value = selectedId;
  }

  function updateUrlHint() {
    const data = loadData();
    const m = data.machines.find(m => m.id === document.getElementById('machineSelect').value);
    const port = document.getElementById('portInput').value.trim();
    document.getElementById('urlHint').textContent =
      m ? `${hostUrl(m.host)}:${port || '____'}/` : '';
  }

  function openModal(machineId) {
    const data = loadData();
    if (data.machines.length === 0) {
      openMachineModal();
      return;
    }
    editingId = null;
    document.getElementById('modalTitle').textContent = '新しいプロジェクトを追加';
    document.getElementById('nameInput').value = '';
    document.getElementById('portInput').value = '';
    fillMachineSelect(machineId || data.machines[0].id);
    updateUrlHint();
    document.getElementById('modalBg').classList.add('show');
    setTimeout(() => document.getElementById('nameInput').focus(), 50);
  }

  function editItem(id) {
    const data = loadData();
    const item = data.items.find(it => it.id === id);
    if (!item) return;
    editingId = id;
    document.getElementById('modalTitle').textContent = '編集';
    document.getElementById('nameInput').value = item.name;
    document.getElementById('portInput').value = item.port;
    fillMachineSelect(item.machineId);
    updateUrlHint();
    document.getElementById('modalBg').classList.add('show');
    setTimeout(() => document.getElementById('portInput').focus(), 50);
  }

  function deleteItem(id) {
    const data = loadData();
    const item = data.items.find(it => it.id === id);
    if (!item) return;
    if (!confirm(`「${item.name}」を削除しますか？`)) return;
    data.items = data.items.filter(it => it.id !== id);
    saveData(data);
    render();
  }

  function saveItem() {
    const name = document.getElementById('nameInput').value.trim();
    const machineId = document.getElementById('machineSelect').value;
    const port = Number(document.getElementById('portInput').value.trim());
    if (!name || !machineId || !port) {
      alert('名前・マシン・ポート番号を入力してください');
      return;
    }
    if (!Number.isInteger(port) || port < 1 || port > 65535) {
      alert('ポート番号は 1〜65535 で入力してください');
      return;
    }
    const data = loadData();
    if (editingId !== null) {
      const item = data.items.find(it => it.id === editingId);
      if (item) Object.assign(item, { name, machineId, port });
    } else {
      data.items.push({ id: uid(), machineId, name, port, path: '' });
    }
    saveData(data);
    closeModal();
    render();
  }

  function openMachineModal() {
    editingMachineId = null;
    document.getElementById('machineModalTitle').textContent = '新しいマシンを追加';
    document.getElementById('machineNameInput').value = '';
    document.getElementById('hostInput').value = '';
    document.getElementById('machineModalBg').classList.add('show');
    setTimeout(() => document.getElementById('machineNameInput').focus(), 50);
  }

  function editMachine(id) {
    const data = loadData();
    const m = data.machines.find(m => m.id === id);
    if (!m) return;
    editingMachineId = id;
    document.getElementById('machineModalTitle').textContent = 'マシンを編集';
    document.getElementById('machineNameInput').value = m.name;
    document.getElementById('hostInput').value = m.host;
    document.getElementById('machineModalBg').classList.add('show');
    setTimeout(() => document.getElementById('hostInput').focus(), 50);
  }

  function deleteMachine(id) {
    const data = loadData();
    const m = data.machines.find(m => m.id === id);
    if (!m) return;
    const count = data.items.filter(it => it.machineId === id).length;
    const msg = count > 0
      ? `「${m.name}」とそのプロジェクト${count}件を削除しますか？`
      : `「${m.name}」を削除しますか？`;
    if (!confirm(msg)) return;
    data.machines = data.machines.filter(x => x.id !== id);
    data.items = data.items.filter(it => it.machineId !== id);
    saveData(data);
    render();
  }

  function saveMachine() {
    let host = document.getElementById('hostInput').value.trim();
    const name = document.getElementById('machineNameInput').value.trim();
    if (!host) {
      alert('IPアドレスを入力してください');
      return;
    }
    // http:// や末尾の / は不要なので取り除く（https:// は残す）
    host = host.replace(/^http:\/\//i, '').replace(/\/+$/, '');
    const data = loadData();
    if (editingMachineId !== null) {
      const m = data.machines.find(m => m.id === editingMachineId);
      if (m) Object.assign(m, { name: name || host, host });
    } else {
      data.machines.push({ id: uid(), name: name || host, host });
    }
    saveData(data);
    closeModal();
    render();
  }

  function closeModal() {
    document.getElementById('modalBg').classList.remove('show');
    document.getElementById('machineModalBg').classList.remove('show');
  }

  function closeModalIfBg(e) {
    if (e.target.classList.contains('modal-bg')) closeModal();
  }

  // Enterキーで保存
  document.addEventListener('keydown', (e) => {
    const itemOpen = document.getElementById('modalBg').classList.contains('show');
    const machineOpen = document.getElementById('machineModalBg').classList.contains('show');
    if (!itemOpen && !machineOpen) return;
    if (e.key === 'Escape') closeModal();
    if (e.key === 'Enter' && !e.isComposing) {
      if (itemOpen) saveItem(); else saveMachine();
    }
  });

  // 初期レンダー
  render();
</script>

</body>
</html>
