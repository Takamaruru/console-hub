<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Console Hub</title>
<style>
  :root {
    --bg: #1e1e2e;
    --surface: #313244;
    --surface-hover: #45475a;
    --text: #cdd6f4;
    --accent: #cba6f7;
    --accent-2: #f5c2e7;
    --danger: #f38ba8;
    --success: #a6e3a1;
    --muted: #6c7086;
    --border: #45475a;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    margin: 0;
    min-height: 100vh;
    padding: 32px 16px 80px;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
    flex-wrap: wrap;
    gap: 12px;
  }

  h1 {
    color: var(--accent);
    font-size: 1.6rem;
    margin: 0;
    font-weight: 600;
  }

  .subtitle {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 2px;
  }

  .add-btn {
    background: var(--accent);
    color: var(--bg);
    border: none;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform .15s, opacity .15s;
  }
  .add-btn:hover { transform: translateY(-2px); opacity: .9; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 14px;
  }

  .card {
    background: var(--surface);
    border-radius: 14px;
    padding: 20px;
    text-decoration: none;
    color: var(--text);
    position: relative;
    transition: transform .15s, background .15s;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-height: 96px;
    border: 1px solid transparent;
  }
  .card:hover {
    background: var(--surface-hover);
    transform: translateY(-3px);
    border-color: var(--accent);
  }

  .card-name {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--accent-2);
    word-break: break-all;
  }

  .card-url {
    font-size: 0.78rem;
    color: var(--muted);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    word-break: break-all;
  }

  .card-actions {
    position: absolute;
    top: 8px;
    right: 8px;
    display: flex;
    gap: 4px;
    opacity: 0;
    transition: opacity .15s;
  }
  .card:hover .card-actions { opacity: 1; }

  .icon-btn {
    background: rgba(0,0,0,.3);
    border: none;
    color: var(--text);
    width: 26px;
    height: 26px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
    display: grid;
    place-items: center;
  }
  .icon-btn:hover { background: var(--bg); }
  .icon-btn.del:hover { background: var(--danger); color: var(--bg); }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 60px 20px;
    border: 2px dashed var(--border);
    border-radius: 14px;
  }

  /* Modal */
  .modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.6);
    backdrop-filter: blur(4px);
    display: none;
    place-items: center;
    z-index: 100;
    padding: 20px;
  }
  .modal-bg.show { display: grid; }

  .modal {
    background: var(--surface);
    border-radius: 16px;
    padding: 24px;
    width: 100%;
    max-width: 420px;
    border: 1px solid var(--border);
  }

  .modal h2 {
    margin: 0 0 16px;
    color: var(--accent);
    font-size: 1.2rem;
  }

  .field {
    margin-bottom: 14px;
  }
  .field label {
    display: block;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 0.95rem;
    font-family: inherit;
  }
  .field input:focus {
    outline: none;
    border-color: var(--accent);
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 18px;
  }
  .btn {
    padding: 9px 18px;
    border-radius: 8px;
    border: none;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-primary { background: var(--accent); color: var(--bg); }
  .btn-secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
  .btn-primary:hover, .btn-secondary:hover { opacity: .85; }

  .footer {
    margin-top: 32px;
    text-align: center;
    color: var(--muted);
    font-size: 0.78rem;
  }
  .footer a { color: var(--muted); }

  @media (max-width: 480px) {
    h1 { font-size: 1.3rem; }
    .grid { grid-template-columns: 1fr 1fr; gap: 10px; }
    .card { padding: 16px; min-height: 80px; }
    .card-name { font-size: 1rem; }
    .card-actions { opacity: 1; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <h1>🖥️ Console Hub</h1>
      <div class="subtitle">プロジェクト別ターミナル</div>
    </div>
    <button class="add-btn" onclick="openModal()">+ 追加</button>
  </header>

  <div id="grid" class="grid"></div>

  <div class="footer">
    データはこのブラウザのlocalStorageに保存されています
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal-bg" id="modalBg" onclick="closeModalIfBg(event)">
  <div class="modal">
    <h2 id="modalTitle">新しいプロジェクトを追加</h2>
    <div class="field">
      <label for="nameInput">名前</label>
      <input type="text" id="nameInput" placeholder="Temportal" autocomplete="off">
    </div>
    <div class="field">
      <label for="urlInput">URL</label>
      <input type="text" id="urlInput" placeholder="http://100.96.72.56:3001/" autocomplete="off">
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="saveItem()">保存</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'consoleHubItems_v1';
  let editingIndex = null;

  function loadItems() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      return JSON.parse(raw);
    } catch (e) {
      return [];
    }
  }

  function saveItems(items) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  }

  function render() {
    const items = loadItems();
    const grid = document.getElementById('grid');

    if (items.length === 0) {
      grid.outerHTML = '<div id="grid" class="empty">まだ何もないみたいだ。<br>右上の「+ 追加」から始めよう。</div>';
      return;
    }

    grid.className = 'grid';
    grid.innerHTML = items.map((item, i) => `
      <a class="card" href="${escapeHtml(item.url)}" target="_blank" rel="noopener">
        <div class="card-name">${escapeHtml(item.name)}</div>
        <div class="card-url">${escapeHtml(item.url)}</div>
        <div class="card-actions">
          <button class="icon-btn" onclick="event.preventDefault();event.stopPropagation();editItem(${i})" title="編集">✏️</button>
          <button class="icon-btn del" onclick="event.preventDefault();event.stopPropagation();deleteItem(${i})" title="削除">🗑</button>
        </div>
      </a>
    `).join('');
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function openModal() {
    editingIndex = null;
    document.getElementById('modalTitle').textContent = '新しいプロジェクトを追加';
    document.getElementById('nameInput').value = '';
    document.getElementById('urlInput').value = '';
    document.getElementById('modalBg').classList.add('show');
    setTimeout(() => document.getElementById('nameInput').focus(), 50);
  }

  function editItem(index) {
    const items = loadItems();
    const item = items[index];
    if (!item) return;
    editingIndex = index;
    document.getElementById('modalTitle').textContent = '編集';
    document.getElementById('nameInput').value = item.name;
    document.getElementById('urlInput').value = item.url;
    document.getElementById('modalBg').classList.add('show');
    setTimeout(() => document.getElementById('nameInput').focus(), 50);
  }

  function deleteItem(index) {
    const items = loadItems();
    const item = items[index];
    if (!item) return;
    if (!confirm(`「${item.name}」を削除しますか？`)) return;
    items.splice(index, 1);
    saveItems(items);
    // re-render: if grid was replaced by empty state, restore container
    const oldGrid = document.getElementById('grid');
    if (oldGrid && !oldGrid.classList.contains('grid')) {
      const newGrid = document.createElement('div');
      newGrid.id = 'grid';
      newGrid.className = 'grid';
      oldGrid.replaceWith(newGrid);
    }
    render();
  }

  function saveItem() {
    const name = document.getElementById('nameInput').value.trim();
    let url = document.getElementById('urlInput').value.trim();
    if (!name || !url) {
      alert('両方入力してください');
      return;
    }
    // 簡易URL補正: http:// が無ければ付ける
    if (!/^https?:\/\//i.test(url)) {
      url = 'http://' + url;
    }
    const items = loadItems();
    if (editingIndex !== null) {
      items[editingIndex] = { name, url };
    } else {
      items.push({ name, url });
    }
    saveItems(items);
    closeModal();
    // 空状態からの復帰
    const oldGrid = document.getElementById('grid');
    if (oldGrid && !oldGrid.classList.contains('grid')) {
      const newGrid = document.createElement('div');
      newGrid.id = 'grid';
      newGrid.className = 'grid';
      oldGrid.replaceWith(newGrid);
    }
    render();
  }

  function closeModal() {
    document.getElementById('modalBg').classList.remove('show');
  }

  function closeModalIfBg(e) {
    if (e.target.id === 'modalBg') closeModal();
  }

  // Enterキーで保存
  document.addEventListener('keydown', (e) => {
    const modal = document.getElementById('modalBg');
    if (!modal.classList.contains('show')) return;
    if (e.key === 'Enter') saveItem();
    if (e.key === 'Escape') closeModal();
  });

  // 初期レンダー
  render();
</script>

</body>
</html>
